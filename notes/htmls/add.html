<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儲存式計數器 - 可刪除版</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --settle-color: #f39c12;
            --danger-color: #e74c3c;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: "Microsoft JhengHei", system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 總數顯示區 */
        .header {
            text-align: center;
            padding: 30px 0 20px 0;
        }

        .total-number {
            font-size: 80px;
            font-weight: 800;
            color: #2c3e50;
            margin: 5px 0;
        }

        .label { color: #95a5a6; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }

        /* 結算按鈕樣式 */
        .settle-btn {
            background: white;
            border: 2px solid var(--settle-color);
            color: var(--settle-color);
            padding: 8px 25px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }
        .settle-btn:hover { background: var(--settle-color); color: white; }
        .settle-btn:active { transform: scale(0.95); }

        /* 按鈕展示區 */
        #button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px 0;
            border-top: 2px solid #f1f1f1;
        }

        .action-btn {
            position: relative; /* 為了定位刪除按鈕 */
            background: white;
            border: 2px solid #edf2f7;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            user-select: none; /* 防止點擊時選取文字 */
        }

        .action-btn:hover { border-color: var(--primary-color); background: #f0f7ff; }
        .action-btn:active { transform: scale(0.98); }
        .action-btn .btn-num { display: block; font-size: 20px; font-weight: bold; color: var(--primary-color); }
        .action-btn .btn-text { font-size: 14px; color: #666; }

        /* 刪除按鈕樣式 (新增) */
        .delete-icon {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #fff;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
            z-index: 10;
        }
        
        .delete-icon:hover {
            background-color: var(--danger-color);
            color: white;
            transform: scale(1.1);
        }

        /* 紀錄區 */
        .log-section {
            flex-grow: 1;
            margin-top: 10px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .log-section h3 { font-size: 16px; color: #333; margin-bottom: 10px; display: flex; justify-content: space-between; }

        #log-list {
            list-style: none;
            padding: 0;
            max-height: 250px;
            overflow-y: auto;
            font-size: 13px;
        }

        #log-list li {
            padding: 8px 0;
            border-bottom: 1px dotted #ddd;
            display: flex;
            justify-content: space-between;
        }
        
        .log-settle { color: var(--settle-color); font-weight: bold; background: #fff9f0; }

        /* 浮動新增按鈕 */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(74,144,226,0.4);
            border: none;
            transition: transform 0.2s;
            z-index: 100;
        }
        .fab:hover { transform: rotate(90deg) scale(1.1); }

        /* 彈出視窗 (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 80%;
            max-width: 350px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .modal h2 { margin-top: 0; font-size: 18px; }
        .modal input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 1px solid #ddd; border-radius: 8px;
            box-sizing: border-box; font-size: 16px;
        }

        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; }
        .confirm-btn { background: var(--primary-color); color: white; }
        .cancel-btn { background: #eee; }

        .reset-link {
            text-align: center;
            color: #ccc;
            font-size: 11px;
            cursor: pointer;
            margin-top: 20px;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="label">目前累積總計</div>
        <div class="total-number" id="total-display">0</div>
        <button class="settle-btn" onclick="settleAndReset()">結算歸零</button>
    </div>

    <div id="button-grid">
        <!-- 按鈕會由 JS 產生 -->
    </div>

    <div class="log-section">
        <h3>歷史紀錄</h3>
        <ul id="log-list"></ul>
    </div>

    <div class="reset-link" onclick="hardReset()">清除所有按鈕與資料</div>
</div>

<button class="fab" onclick="openModal()">+</button>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <h2>新增自訂按鈕</h2>
        <input type="number" id="input-num" placeholder="增加數字 (如: 50)">
        <input type="text" id="input-text" placeholder="事項說明 (如: 運動)">
        <div class="modal-btns">
            <button class="cancel-btn" onclick="closeModal()">取消</button>
            <button class="confirm-btn" onclick="saveNewButton()">確認新增</button>
        </div>
    </div>
</div>

<script>
    // 初始化資料結構
    let data = {
        total: 0,
        buttons: [],
        logs: []
    };

    // 從 LocalStorage 載入
    function init() {
        const saved = localStorage.getItem('counter_app_v2');
        if (saved) {
            data = JSON.parse(saved);
        }
        render();
    }

    // 儲存
    function save() {
        localStorage.setItem('counter_app_v2', JSON.stringify(data));
    }

    // 畫面渲染
    function render() {
        document.getElementById('total-display').textContent = data.total;

        const grid = document.getElementById('button-grid');
        grid.innerHTML = '';
        
        data.buttons.forEach((btn, index) => {
            // 改用 div 避免 button 內嵌 button 的問題
            const el = document.createElement('div');
            el.className = 'action-btn';
            
            // 點擊整個區塊執行加法
            el.onclick = () => performAdd(btn.num, btn.text);

            el.innerHTML = `
                <div class="delete-icon" onclick="deleteButton(event, ${index})">×</div>
                <span class="btn-num">+${btn.num}</span>
                <span class="btn-text">${btn.text}</span>
            `;
            grid.appendChild(el);
        });

        const list = document.getElementById('log-list');
        list.innerHTML = '';
        // 倒序顯示，最新的在上面
        [...data.logs].reverse().forEach(log => {
            const li = document.createElement('li');
            if (log.type === 'settle') li.className = 'log-settle';
            li.innerHTML = `<span>[${log.time}] ${log.msg}</span> <span>${log.res}</span>`;
            list.appendChild(li);
        });
    }

    // 取得當前時間字串
    function getTimeStr() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }

    // 加法動作
    function performAdd(num, text) {
        data.total += parseInt(num);
        data.logs.push({
            time: getTimeStr(),
            msg: `新增 ${text}`,
            res: `+${num} (總計:${data.total})`,
            type: 'add'
        });
        if (data.logs.length > 100) data.logs.shift(); // 最多存100筆
        save();
        render();
    }

    // 刪除單個按鈕功能
    function deleteButton(event, index) {
        // 停止事件冒泡，防止觸發加法
        event.stopPropagation();
        
        const targetBtn = data.buttons[index];
        if (confirm(`確定要刪除「${targetBtn.text} (+${targetBtn.num})」這個按鈕嗎？`)) {
            data.buttons.splice(index, 1); // 移除該按鈕
            save();
            render();
        }
    }

    // 結算歸零
    function settleAndReset() {
        if (data.total === 0 && data.logs.length > 0 && data.logs[data.logs.length-1].type === 'settle') {
            return; // 避免重複結算 0
        }

        const previousTotal = data.total;
        data.total = 0;
        data.logs.push({
            time: getTimeStr(),
            msg: `⭐ 結算歸零 (前次總計: ${previousTotal})`,
            res: `已清空`,
            type: 'settle'
        });
        
        save();
        render();
    }

    // Modal 控制
    function openModal() {
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('input-num').focus();
    }
    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('input-num').value = '';
        document.getElementById('input-text').value = '';
    }

    function saveNewButton() {
        const num = document.getElementById('input-num').value;
        const text = document.getElementById('input-text').value;
        if (num && text) {
            data.buttons.push({ num: parseInt(num), text: text });
            save();
            render();
            closeModal();
        }
    }

    // 強制重置 (刪除所有資料)
    function hardReset() {
        if (confirm('這會刪除所有自訂按鈕和歷史紀錄，確定嗎？')) {
            data = { total: 0, buttons: [], logs: [] };
            save();
            render();
        }
    }

    // 點背景關閉
    window.onclick = (e) => {
        if (e.target == document.getElementById('modal-overlay')) closeModal();
    }

    init();
</script>

</body>
</html>
